[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system"
version = "0.1.0"
description = "基于 CrewAI 和 GPT-4o 的学生多维度能力评估系统"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "znzz-competition-team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心依赖 (根据你项目的功能特性整理)
dependencies = [
    "openai>=1.0.0",
    "crewai>=0.30.0",
    "langchain>=0.1.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    # 多媒体处理
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "ffmpeg-python>=0.2.0",
    "moviepy>=1.0.3",
    # API 接口
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "ipython>=8.0.0",
]

# ==============================================================================
# Ruff 配置 (Python 界的 Clang-Format 替代方案)
# ==============================================================================
[tool.ruff]
# 设置每行最大长度 (与之前建议的 120 保持一致)
line-length = 120

# 检查的文件夹
src = ["src", "examples"]

[tool.ruff.lint]
# 启用的规则集
# E/W: pycodestyle, F: Pyflakes, I: isort, B: flake8-bugbear, C4: flake8-comprehensions
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501"] # 既然设置了 line-length，有时可忽略硬性长度报错

[tool.ruff.lint.isort]
# 自动合并同包导入
combine-as-imports = true

[tool.ruff.format]
# 使用双引号
quote-style = "double"
# 缩进使用空格
indent-style = "space"
# 自动处理结尾逗号
skip-magic-trailing-comma = false

# ==============================================================================
# Pytest 配置 (用于后续单元测试)
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"